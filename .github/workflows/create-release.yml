name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z)
        type: string
        required: true
      summary:
        description: Summary section of the release notes (markdown)
        type: string
        required: true
      commits:
        description: List every commit in the notes (off - counts and a compare link only)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      SUMMARY: ${{ inputs.summary }}

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main, not ${GITHUB_REF}"
          exit 1

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version
        id: validate
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Version must be X.Y.Z, got: $VERSION"
          [[ -n "${SUMMARY//[[:space:]]/}" ]] || fail "Summary is empty"
          latest=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          [[ -n "$latest" ]] || fail "No previous release tag found"
          ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null || fail "Version $VERSION was already released"
          [[ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)" == "$VERSION" ]] \
            || fail "Version $VERSION is lower than the latest release $latest"
          [[ -n "$(git log "$latest..HEAD" --oneline)" ]] || fail "No commits since $latest"
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml)
          [[ "$current" == "$VERSION" ]] || fail "main is at $current, not $VERSION: set the version on main first"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: commit
        env:
          LATEST: ${{ steps.validate.outputs.latest }}
          COMMITS: ${{ inputs.commits }}
        run: |
          printf '%s\n' "$SUMMARY" > "$RUNNER_TEMP/summary.md"
          flags=()
          [[ "$COMMITS" == true ]] || flags+=(--no-commits)
          bash bin/release-notes.sh "${flags[@]}" "$VERSION" "$LATEST" "$RUNNER_TEMP/summary.md" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push release
        run: git push origin HEAD:refs/heads/release

      - name: Create GitHub release
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: gh release create "$VERSION" --target "$SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    name: Build Docker Image
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
