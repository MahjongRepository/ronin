[global_tags]
  boot = "${BOOT}"

[agent]
  quiet = true
  omit_hostname = true
  skip_processors_after_aggregators = true

[[outputs.sql]]
  driver = "sqlite"
  data_source_name = "file:${METRICS_DB}?_pragma=busy_timeout(10000)&_time_integer_format=unix"
  table_update_template = "ALTER TABLE {TABLE} ADD COLUMN {COLUMN}"
  batch_transactions = true

[[processors.strings]]
  namepass = ["cgroup"]
  [[processors.strings.replace]]
    field_key = "*"
    old = "."
    new = "_"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = true
  fieldinclude = ["time_*"]

[[inputs.mem]]
  fieldinclude = ["used", "available", "total"]

[[inputs.disk]]
  mount_points = ["/"]
  fieldinclude = ["used", "total"]

[[inputs.net]]
  interfaces = ["eth*", "en*"]
  fieldinclude = ["bytes_recv", "bytes_sent"]

[[inputs.kernel]]
  collect = ["psi"]
  fieldinclude = ["total"]

[[inputs.cgroup]]
  paths = ["${METRICS_CGROUP_SLICES:-/sys/fs/cgroup/ronin.slice/ronin-*.slice}"]
  files = ["cpu.stat", "memory.current", "memory.events"]
  fieldinclude = ["cpu.stat.usage_usec", "memory.current", "memory.events.oom_kill"]

[[inputs.http]]
  urls = ["${METRICS_GAME_STATUS_URL:-http://127.0.0.1:8711/status}"]
  timeout = "5s"
  data_format = "json"
  name_override = "game_status"
  tagexclude = ["url"]
  fieldinclude = [
    "active_games",
    "pending_games",
    "started_at",
    "reconnects",
    "takeovers",
    "resyncs",
    "timeouts_turn",
    "timeouts_meld",
    "timeouts_round_advance",
    "ai_replacements",
    "connections",
    "connections_accepted",
    "messages_in",
    "bytes_in",
    "messages_out",
    "bytes_out",
    "handling_seconds",
    "handled_messages",
    "malformed_messages",
    "rate_limited_messages",
    "closes_1000",
    "closes_1008",
    "closes_1011",
    "closes_4001",
    "closes_4002",
    "closes_4004",
    "loop_lag_max_ms",
  ]

[[inputs.prometheus]]
  urls = ["${METRICS_TRAEFIK_URL:-http://127.0.0.1:8082/metrics}"]
  timeout = "5s"
  metric_version = 2
  name_override = "traefik"
  fieldinclude = ["traefik_router_request_duration_seconds_sum", "traefik_router_request_duration_seconds_count"]
  taginclude = ["boot", "router", "code", "method", "protocol"]

[[inputs.filestat]]
  files = [
    "${METRICS_RONIN_DB:-/opt/ronin/data/db/ronin.db}",
    "${METRICS_RONIN_DB:-/opt/ronin/data/db/ronin.db}-wal",
    "${METRICS_BACKUP_STAMP:-/opt/ronin/data/metrics/last-backup}",
  ]
  fieldinclude = ["exists", "size_bytes", "modification_time"]

[[inputs.filecount]]
  directories = ["${METRICS_REPLAY_DIR:-/opt/ronin/data/replays}"]
  recursive = true
  fieldinclude = ["size_bytes"]
