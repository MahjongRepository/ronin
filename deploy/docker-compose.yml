services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    cgroup_parent: ronin-traefik.slice
    depends_on:
      lobby:
        condition: service_started
      game:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8082:8082"
    volumes:
      - ./config/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./data/traefik:/letsencrypt
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.aliasheadersstrategy=delete"
      - "--entrypoints.websecure.http.aliasheadersstrategy=delete"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=false"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addrouterslabels=true"
      - "--metrics.prometheus.addentrypointslabels=false"
      - "--metrics.prometheus.addserviceslabels=false"
    logging:
      driver: journald
      options:
        tag: "ronin"

  lobby:
    image: ghcr.io/mahjongrepository/ronin:latest
    cgroup_parent: ronin-lobby.slice
    command: >
      uvicorn --factory lobby.server.app:get_app
      --host 0.0.0.0 --port 8710
      --proxy-headers --forwarded-allow-ips=*
      --timeout-graceful-shutdown 5
      --ws websockets-sansio --ws-per-message-deflate false --ws-ping-interval 20 --ws-ping-timeout 20 --ws-max-size 8192
      --log-level info
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:8710:8710"
    environment:
      AUTH_GAME_TICKET_SECRET: ${AUTH_GAME_TICKET_SECRET:?Set AUTH_GAME_TICKET_SECRET}
      AUTH_INTERNAL_API_SECRET: ${AUTH_INTERNAL_API_SECRET:?Set AUTH_INTERNAL_API_SECRET}
      AUTH_DATABASE_PATH: /app/data/db/ronin.db
      AUTH_COOKIE_SECURE: "true"
      LOBBY_STATIC_DIR: /app/frontend/lobby/public
      LOBBY_ASSETS_DIR: /app/frontend/lobby/dist
      LOBBY_GAME_CLIENT_V2_DIR: /app/frontend/game_v2/dist
      LOBBY_GAME_CLIENT_URL: /play
      LOBBY_ALLOWED_HOSTS: %%DOMAIN%%,localhost
      LOBBY_WS_ALLOWED_ORIGIN: https://%%DOMAIN%%
      LOBBY_REPLAY_DIR: /app/data/replays
      LOBBY_GAME_SERVER_URL: http://game:8711
      LOBBY_GAME_SERVER_WS_URL: wss://%%DOMAIN%%
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data/db:/app/data/db
      - ./data/replays:/app/data/replays:ro
    depends_on:
      game:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8710/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: journald
      options:
        tag: "ronin"

  game:
    image: ghcr.io/mahjongrepository/ronin:latest
    cgroup_parent: ronin-game.slice
    command: >
      uvicorn --factory game.server.app:get_app
      --host 0.0.0.0 --port 8711
      --proxy-headers --forwarded-allow-ips=*
      --timeout-graceful-shutdown 5
      --ws websockets-sansio --ws-per-message-deflate false --ws-ping-interval 20 --ws-ping-timeout 20 --ws-max-size 262144
      --log-level info
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:8711:8711"
    environment:
      AUTH_GAME_TICKET_SECRET: ${AUTH_GAME_TICKET_SECRET:?Set AUTH_GAME_TICKET_SECRET}
      AUTH_INTERNAL_API_SECRET: ${AUTH_INTERNAL_API_SECRET:?Set AUTH_INTERNAL_API_SECRET}
      AUTH_DATABASE_PATH: /app/data/db/ronin.db
      GAME_REPLAY_DIR: /app/data/replays
      GAME_CORS_ORIGINS: https://%%DOMAIN%%
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data/db:/app/data/db
      - ./data/replays:/app/data/replays
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8711/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: journald
      options:
        tag: "ronin"
