[project]
name = "ronin"
version = "0.25.0"
requires-python = ">=3.14"
dependencies = [
    "starlette==1.8.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "bcrypt==5.0.0",
    "anyio==4.15.1",
    "structlog==26.1.0",
    "markupsafe==3.0.4",
]

[dependency-groups]
dev = [
    "docformatter==1.7.8",
    "httpx2==2.13.1",
    "import-linter==2.15",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "python-dotenv==1.2.4",
    "ruff==0.17.0",
    "ty==0.0.87",
]

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--no-header --tb=short -qq"
timeout = 10

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY",
    "D",
    "EM101",
    "EM102",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"{test_*.py,conftest.py,**/tests/**/helpers.py,**/tests/**/helpers/*.py,**/tests/**/mocks/*.py}" = [
    "ANN", # Missing type annotation
    "ARG", # Unused function arguments
    "PLR0913", # Too many arguments (test factories)
    "PLR2004", # Magic value used in comparison
    "S101", # Use of `assert` detected
    "S105", # Possible hardcoded password
    "S106", # Possible hardcoded password assigned to argument
    "SLF001", # Private member accessed
]
"scripts/**/*.py" = ["T201", "PLR2004"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.docformatter]
recursive = true
make-summary-multi-line = true
pre-summary-newline = true
close-quotes-on-newline = true
wrap-summaries = 120
wrap-descriptions = 120
black = true
exclude = [".venv"]

[tool.ty.terminal]
error-on-warning = true

[[tool.ty.overrides]]
include = ["**/test_*.py", "**/conftest.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    '^\s*(((async )?def .*?)?[\])]+(\s*->.*?)?:\s*)?\.\.\.\s*(#|$)',
    'if (typing\.)?TYPE_CHECKING:',
    '#\s*pragma: no cover \((exhaustive|entrypoint|platform)\)',
]

[tool.importlinter]
root_packages = ["app", "scripts", "tests"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "the app never imports a script"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["scripts"]

[[tool.importlinter.contracts]]
name = "app: server -> views -> features -> game start -> occupancy and players -> auth, i18n, db and replays -> settings, dal and socket primitives -> tasks"
type = "layers"
layers = [
    "app.server",
    "app.views",
    "app.rooms | app.matchmaking | app.monitoring | app.tournaments | app.live_games",
    "app.game_transition | app.websocket_utils | app.chat_messages",
    "app.occupancy | app.players",
    "app.auth | app.i18n | app.db | app.replay_storage",
    "app.settings | app.dal | app.queued_websocket | app.rate_limit",
    "app.tasks",
]

[[tool.importlinter.contracts]]
name = "only composition roots, scripts and the db tests open the database"
type = "protected"
protected_modules = ["app.db"]
allowed_importers = ["app.server.app", "scripts", "tests.unit.db", "tests.unit.test_auth_service"]
