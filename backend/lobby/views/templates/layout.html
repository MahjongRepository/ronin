<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="dark" style="background-color: var(--pico-background-color, #0d1415)">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="git-commit" content="{{ git_commit | default('dev') }}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="ronin-app-version" content="{{ app_version | default('dev') }}">
    <meta name="ronin-release-url" content="{{ release_url }}">
    <meta name="ronin-current-year" content="{{ current_year }}">
    <meta name="ronin-dev-mode" content="{{ 'true' if dev_mode else 'false' }}">
    <title>{% block title %}{{ t("page.title.default") }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/static/icons/apple-180.png">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#0d1415">
    <meta name="apple-mobile-web-app-title" content="Ronin">
    {% if vite_dev %}
    <script type="module" src="{{ vite_dev_url }}/@vite/client"></script>
    {% endif %}
    {% block styles %}
    {% if lobby_css_url %}
    <link rel="stylesheet" href="{{ lobby_css_url }}">
    {% endif %}
    {% endblock %}
</head>
<body>
{% block body %}{% endblock %}
    {% block scripts %}
    {% if lobby_js_url %}
    <script type="module" src="{{ lobby_js_url }}"></script>
    {% endif %}
    {% endblock %}
</body>
</html>
