[project]
name = "ronin"
version = "0.4.0"
requires-python = ">=3.14"
dependencies = [
    "starlette==1.8.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "mahjong==2.0.0",
    "msgpack==1.2.3",
    "xiangting==6.0.2",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "bcrypt==5.0.0",
    "anyio==4.15.1",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "docformatter==1.7.8",
    "httpx2==2.13.1",
    "import-linter==2.15",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "python-dotenv==1.2.4",
    "ruff==0.17.0",
    "ty==0.0.87",
]

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lobby", "game", "shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--no-header --tb=short -qq"
timeout = 10

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY",
    "D",
    "EM101",
    "EM102",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"{test_*.py,conftest.py,**/tests/**/helpers.py,**/tests/**/helpers/*.py,**/tests/**/mocks/*.py}" = [
    "ANN", # Missing type annotation
    "ARG", # Unused function arguments
    "PLR0913", # Too many arguments (test factories)
    "PLR2004", # Magic value used in comparison
    "S101", # Use of `assert` detected
    "S105", # Possible hardcoded password
    "S106", # Possible hardcoded password assigned to argument
    "SLF001", # Private member accessed
]
"scripts/**/*.py" = ["T201", "PLR2004"]
# Base class methods define the interface contract; parameters are unused in the default implementation
"game/logic/ai_player.py" = ["ARG002"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mahjong.shanten".msg = "Use game.logic.shanten instead of mahjong.shanten directly."

[tool.docformatter]
recursive = true
make-summary-multi-line = true
pre-summary-newline = true
close-quotes-on-newline = true
wrap-summaries = 120
wrap-descriptions = 120
black = true
exclude = [".venv", "test_dead_code.py"]

[tool.ty.terminal]
error-on-warning = true

[[tool.ty.overrides]]
include = ["**/test_*.py", "**/conftest.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"

[tool.coverage.run]
source = ["."]
omit = ["**/tests/*", "scripts/*", "debug.py", "game/replay/external/tenhou.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    '^\s*(((async )?def .*?)?[\])]+(\s*->.*?)?:\s*)?\.\.\.\s*(#|$)',
    'if (typing\.)?TYPE_CHECKING:',
    '#\s*pragma: no cover \((exhaustive|entrypoint|platform)\)',
]

[tool.importlinter]
root_packages = ["game", "lobby", "shared", "scripts"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "game and lobby are separate servers that meet only in shared"
type = "independence"
modules = ["game", "lobby"]

[[tool.importlinter.contracts]]
name = "shared is a leaf: it never imports a server or a script"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["game", "lobby", "scripts"]

[[tool.importlinter.contracts]]
name = "game: server -> session -> messaging -> wire -> logic"
type = "layers"
layers = ["game.server", "game.session", "game.messaging", "game.wire", "game.logic"]

[[tool.importlinter.contracts]]
name = "game.logic and game.wire know nothing of replay, auth or persistence"
type = "forbidden"
source_modules = ["game.logic", "game.wire"]
forbidden_modules = ["game.replay", "shared.auth", "shared.dal", "shared.db", "shared.storage", "shared.logging"]

[[tool.importlinter.contracts]]
name = "game.replay is a tool over logic and wire, outside the server"
type = "forbidden"
source_modules = ["game.replay"]
forbidden_modules = ["game.server", "game.session", "game.messaging"]

[[tool.importlinter.contracts]]
name = "game.session writes replays without importing the replay tool"
type = "forbidden"
source_modules = ["game.session"]
forbidden_modules = ["game.replay"]

[[tool.importlinter.contracts]]
name = "lobby: server -> views -> features -> transition helpers -> auth, registry -> settings"
type = "layers"
layers = [
    "lobby.server",
    "lobby.views",
    "lobby.rooms | lobby.matchmaking",
    "lobby.game_transition | lobby.websocket_utils",
    "lobby.auth | lobby.registry",
    "lobby.settings",
]

[[tool.importlinter.contracts]]
name = "lobby.rooms and lobby.matchmaking are independent features"
type = "independence"
modules = ["lobby.rooms", "lobby.matchmaking"]

[[tool.importlinter.contracts]]
name = "shared: db implements dal, auth uses dal"
type = "layers"
layers = ["shared.db", "shared.auth", "shared.dal"]

[[tool.importlinter.contracts]]
name = "only composition roots, scripts and the db tests open the database"
type = "protected"
protected_modules = ["shared.db"]
allowed_importers = ["game.server.app", "lobby.server.app", "scripts", "shared.tests"]
