name: ronin-game-v2

services:
  game-v2:
    image: ronin-game-v2:local
    build:
      context: ../..
      dockerfile: backend/game_v2/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:?Set GO_VERSION to the Go pinned in mise.toml}
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    user: "${GAME_V2_UID:-1000}:${GAME_V2_GID:-1000}"
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:8712:8712"
    environment:
      AUTH_GAME_TICKET_SECRET: ${AUTH_GAME_TICKET_SECRET:?Set AUTH_GAME_TICKET_SECRET}
      AUTH_INTERNAL_API_SECRET: ${AUTH_INTERNAL_API_SECRET:?Set AUTH_INTERNAL_API_SECRET}
      AUTH_DATABASE_PATH: /app/data/db/storage.db
      GAME_REPLAY_DIR: /app/data/replays
      GAME_CORS_ORIGINS: http://localhost:8710
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ..:/app/data/db
      - ../data/game-v2-replays:/app/data/replays
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8712/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
