version: "2"

run:
  build-tags:
    - exhaustive
    - tenhou

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocritic
    - intrange
    - modernize
    - noctx
    - nolintlint
    - revive
    - thelper
    - unconvert
    - unparam
    - usetesting
  settings:
    depguard:
      rules:
        engine-purity:
          list-mode: strict
          files:
            - "**/game_v2/engine/**"
            - "!$test"
          allow:
            - github.com/MahjongRepository/ronin/backend/game_v2/engine
            - cmp$
            - crypto/sha3$
            - embed$
            - errors$
            - fmt$
            - iter$
            - maps$
            - math$
            - math/bits$
            - slices$
            - strconv$
            - strings$
            - time$
        engine-vocabulary:
          files:
            - "**/game_v2/engine/tile/**"
            - "!$test"
          deny:
            - pkg: github.com/MahjongRepository/ronin/backend/game_v2
              desc: engine/tile is the vocabulary under every engine package and imports nothing of the module
        engine-seam-types:
          list-mode: lax
          files:
            - "**/game_v2/engine/play/**"
            - "!$test"
          allow:
            - github.com/MahjongRepository/ronin/backend/game_v2/engine/tile$
          deny:
            - pkg: github.com/MahjongRepository/ronin/backend/game_v2
              desc: engine/play crosses the facade, so it imports only engine/tile of the module
        wire-layer:
          list-mode: lax
          files:
            - "**/game_v2/internal/wire/**"
            - "!$test"
          allow:
            - github.com/MahjongRepository/ronin/backend/game_v2/engine$
            - github.com/MahjongRepository/ronin/backend/game_v2/engine/play$
            - github.com/MahjongRepository/ronin/backend/game_v2/engine/tile$
          deny:
            - pkg: github.com/MahjongRepository/ronin/backend/game_v2
              desc: wire sits under every server package and over the engine, so it imports only the engine's public packages of the module
        messaging-layer:
          list-mode: lax
          files:
            - "**/game_v2/internal/messaging/**"
            - "!$test"
          allow:
            - github.com/MahjongRepository/ronin/backend/game_v2/engine$
            - github.com/MahjongRepository/ronin/backend/game_v2/engine/play$
            - github.com/MahjongRepository/ronin/backend/game_v2/engine/tile$
            - github.com/MahjongRepository/ronin/backend/game_v2/internal/wire$
          deny:
            - pkg: github.com/MahjongRepository/ronin/backend/game_v2
              desc: messaging sits under the session and over the wire, so it imports only the wire and the engine's public packages of the module
        store-leaf:
          files:
            - "**/game_v2/internal/store/**"
            - "!$test"
          deny:
            - pkg: github.com/MahjongRepository/ronin/backend/game_v2
              desc: store is a leaf the session and the server use, so it imports nothing of the module
        auth-leaf:
          files:
            - "**/game_v2/internal/auth/**"
            - "!$test"
          deny:
            - pkg: github.com/MahjongRepository/ronin/backend/game_v2
              desc: auth is a leaf the session and the server use, so it imports nothing of the module
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until|Sleep|After|AfterFunc|Tick|NewTimer|NewTicker)$
          msg: the engine reads no clock and starts no timer; the caller passes time in
        - pattern: ^fmt\.(Print|Fprint|Scan|Fscan).*$
          msg: the engine does no I/O
        - pattern: ^print(ln)?$
          msg: the engine does no I/O
    gochecksumtype:
      default-signifies-exhaustive: false
    govet:
      enable:
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: empty-block
        - name: redefines-builtin-id
  exclusions:
    rules:
      - path-except: ^engine/
        linters:
          - forbidigo
          - gochecknoglobals
          - gochecknoinits
      - path: ^engine/(.+/)?lookup_[^/]*\.go$
        linters:
          - gochecknoglobals

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
