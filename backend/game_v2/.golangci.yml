version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocritic
    - intrange
    - modernize
    - noctx
    - nolintlint
    - revive
    - thelper
    - unconvert
    - unparam
    - usetesting
  settings:
    depguard:
      rules:
        engine-purity:
          list-mode: strict
          files:
            - "**/game_v2/engine/**"
            - "!$test"
          allow:
            - github.com/MahjongRepository/ronin/backend/game_v2/engine
            - cmp$
            - errors$
            - fmt$
            - iter$
            - maps$
            - math$
            - math/bits$
            - slices$
            - strconv$
            - strings$
            - time$
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until|Sleep|After|AfterFunc|Tick|NewTimer|NewTicker)$
          msg: the engine reads no clock and starts no timer; the caller passes time in
        - pattern: ^fmt\.(Print|Fprint|Scan|Fscan).*$
          msg: the engine does no I/O
        - pattern: ^print(ln)?$
          msg: the engine does no I/O
    gochecksumtype:
      default-signifies-exhaustive: false
    govet:
      enable:
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: empty-block
        - name: redefines-builtin-id
  exclusions:
    rules:
      - path-except: ^engine/
        linters:
          - forbidigo
          - gochecknoglobals
          - gochecknoinits
      - path: ^engine/(.+/)?lookup_[^/]*\.go$
        linters:
          - gochecknoglobals

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
