    <style>
      html.loading, html.loading body { margin: 0; background: #154; overflow: hidden; }
      #loaddata { display: none; }
      .loading #board, .loading #space { visibility: hidden; }
      #game-loading, .game-loading {
        position: fixed; inset: 0; z-index: 999; width: auto; margin: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 24px; padding: 32px; box-sizing: border-box; text-align: center;
        background: #154;
        color: #f2eee2; font: 18px/1.6 system-ui, sans-serif;
      }
      .game-loading .loading-brand { font-size: 0.7em; letter-spacing: 0.35em; color: #c9bb92; }
      .game-loading .loading-mark {
        width: 48px; height: 64px; box-sizing: border-box; border: 2px solid #d8c697;
        border-radius: 8px; box-shadow: 4px 4px 0 #071f1a;
        display: grid; place-items: center; font-size: 30px;
      }
      .game-loading p { margin: 0; }
      .game-loading .loading-dots { display: flex; gap: 8px; }
      .game-loading .loading-dots span {
        width: 6px; height: 6px; border-radius: 50%; background: #d8c697;
        animation: loading-pulse 1.2s ease-in-out infinite;
      }
      .game-loading .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
      .game-loading .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
      .game-loading a:any-link { color: #c9bb92; font-size: 0.8em; text-underline-offset: 4px; }
      @keyframes loading-pulse { 50% { opacity: 0.25; transform: translateY(-4px); } }
      @media (pointer: coarse) and (height > 450px) {
        #game-loading, .game-loading { font-size: 32px; gap: 32px; }
        .game-loading .loading-mark { width: 72px; height: 96px; font-size: 44px; }
      }
      .game-loading .loading-choice > [lang] { display: none; }
      html[lang="en"] .game-loading .loading-choice > [lang="en"],
      html[lang="ja"] .game-loading .loading-choice > [lang="ja"],
      html[lang="ru"] .game-loading .loading-choice > [lang="ru"] { display: inline; }
      @media (prefers-reduced-motion: reduce) {
        .game-loading .loading-dots span { animation: none; }
      }
    </style>
